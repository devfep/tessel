[package]
name = "tessel-runner"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "The local test runner: runs a repository's test commands for one trusted user"

[lib]
name = "tessel_runner"
path = "src/lib.rs"

[dependencies]
# Only the types (`GateConfig`, `TestCommand`, `StepOutcome`) and the strict `tessel.toml` parser,
# so the runner accepts exactly the commands the lander's gate accepts. No git function is called.
tessel-lander = { path = "../tessel-lander" }
# `getpwuid_r` and `geteuid` for the user check, `killpg` for the timeout. Already in the lockfile
# through the lander, at the same pin.
libc = "=0.2.190"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
# The configuration file; the version the CLI, the lander and the server already use.
toml = { version = "=1.1.6", default-features = false, features = ["parse", "serde"] }
thiserror = "=2.0.21"

[dev-dependencies]
proptest = "1.11.0"
tempfile = "=3.27.0"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"
panic_in_result_fn = "deny"
unimplemented = "deny"
allow_attributes = "deny"
dbg_macro = "deny"
todo = "deny"
print_stdout = "deny"
print_stderr = "deny"
await_holding_lock = "deny"
large_futures = "deny"
exit = "deny"
mem_forget = "deny"
wildcard_enum_match_arm = "deny"
match_wildcard_for_single_variants = "deny"
module_name_repetitions = "allow"
similar_names = "allow"
# An internal binary's library: per-function `# Errors` sections would only restate the error types.
missing_errors_doc = "allow"
must_use_candidate = "allow"

# GitHub Pages site configuration. GitHub Pages builds the documentation site from `main` with
# its built-in Jekyll; nothing else in this repository reads this file.

title: Tessel
description: A transaction layer for many AI coding agents working in one repository
theme: jekyll-theme-minimal

plugins:
  - jekyll-relative-links
  - jekyll-optional-front-matter
  - jekyll-readme-index

relative_links:
  enabled: true
  collections: true

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

exclude:
  - "target/"
  - "node_modules/"
  - "tessel-steward/node_modules/"
  - "tessel-steward/.wrangler/"
  - "Cargo.lock"
  - "pnpm-lock.yaml"
  - "tessel-steward/pnpm-lock.yaml"
  - ".claude/"
  - "AGENTS.md"
  - "*.toml"
  - "*.jsonc"
  - "*.json"
  - "*.jsonl"
  - "*.log"
  - "*.sh"
  - "*.rs"
  - "*.ts"
  - "*.py"
  - "Dockerfile"
  - "*.Dockerfile"
  - "proptest-regressions/"
  - "tools/"
  - "src/"
  - "tessel-cli/"
  - "tessel-steward/"
  - "tessel-swarm/src/"
  - "tessel-swarm/tests/"
  - "docs/ROADMAP.md"
  - "docs/BUILD-PROTOCOL.md"

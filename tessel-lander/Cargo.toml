[package]
name = "tessel-lander"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Git command layer and coverage check for the Tessel lander"

[dependencies]
# Shared wire types and `Mode::permits`; without the `runtime` feature there is no `worker`.
tessel-coordinator = { path = "..", default-features = false }
# `killpg`: the runner kills the whole process group of a timed-out command.
libc = "=0.2.190"
serde_json = "=1.0.151"
thiserror = "=2.0.21"

[dev-dependencies]
tempfile = "=3.27.0"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"
panic_in_result_fn = "deny"
unimplemented = "deny"
allow_attributes = "deny"
dbg_macro = "deny"
todo = "deny"
print_stdout = "deny"
print_stderr = "deny"
await_holding_lock = "deny"
large_futures = "deny"
exit = "deny"
mem_forget = "deny"
wildcard_enum_match_arm = "deny"
module_name_repetitions = "allow"
similar_names = "allow"
# An internal library: per-function `# Errors` sections would only restate the error types.
missing_errors_doc = "allow"
must_use_candidate = "allow"

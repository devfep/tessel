# The trunk's gate for Tessel's own commits, read by the server's lander (docs/dogfood.md) and,
# until M6, by the steward (tessel-steward/src/tessel-config.ts).
# The lander reads this file from the trunk commit a landing is based on, never from the fork.
# Every command is an argv array run without a shell, in a fresh clone of the rebased commit.
#
# This file is the gate, so who may change it is fixed:
# - The server's lander refuses a submission that touches it, with the fixed reason "changes the
#   gate (tessel.toml)".
# - The file changes through a pull request that Felix merges.
# - The lander ignores `instance` and `[install]`: the runner uses the machine's own toolchain and
#   dependencies. The steward still reads both until M6.
# - Clippy, the named-tests check, actionlint, zizmor and the steward's tests run on CI, which
#   runs on main after a landing. Each lane also runs actionlint and zizmor in its gate before it
#   submits. The steward's tests are not here because the runner's test tree is a fresh clone
#   without node_modules.
# Commands are checked strictly: `pnpm test`, `npm test`, exactly `cargo fmt --all --check`, or
# `cargo test` with only these flags: --workspace --locked --offline --no-fail-fast --all-targets
# --all-features --release --lib --bins --tests.
instance = "standard-4"

[install]
cargo = true
pnpm = ["tessel-steward"]

[[test]]
argv = ["cargo", "fmt", "--all", "--check"]

[[test]]
argv = ["cargo", "test", "--workspace", "--locked", "--offline", "--no-fail-fast"]

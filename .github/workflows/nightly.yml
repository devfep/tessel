name: Nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      test_filter:
        description: >-
          nextest filterset every mutants shard passes to the test tool (nextest -E). Empty runs
          every test.
        required: false
        default: ""
        type: string
  pull_request:
    paths:
      - .github/workflows/nightly.yml
      - .cargo/mutants.toml
      - scripts/ci/new-missed-mutants.sh
      - scripts/ci/new-missed-mutants.test.sh
      - .cargo/mutants-missed-baseline.txt

permissions:
  contents: read

concurrency:
  group: >-
    nightly-${{ github.event_name == 'pull_request' &&
    github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  proptest:
    name: Nightly, proptest at 10,000 cases
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283  # v2.87.29
        with:
          tool: cargo-nextest@0.9.148
      - name: Core library tests at 10,000 cases
        env:
          PROPTEST_CASES: "10000"
        run: cargo nextest run -p tessel-coordinator --lib

  comparison-test:
    name: Nightly, comparison script test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Comparison script test
        run: scripts/ci/new-missed-mutants.test.sh

  mutants:
    name: Nightly, full mutants shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: ["0/4", "1/4", "2/4", "3/4"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283  # v2.87.29
        with:
          tool: cargo-mutants@27.1.0,cargo-nextest@0.9.148
      - name: Mutants on the core
        env:
          SHARD: ${{ matrix.shard }}
          TEST_FILTER: ${{ inputs.test_filter }}
        run: |
          filter_args=()
          if [ -n "$TEST_FILTER" ]; then
            filter_args=(-- -E "$TEST_FILTER")
          fi
          # Cap the address space of every test process, so a mutant that allocates without
          # bound fails its test instead of exhausting the runner. Builds are not capped. This is a
          # safety net, not a guarantee: the baseline passes under 3 GiB per test process, the
          # per-process peak is unmeasured so the cap is not lowered, and 3 GiB x 4 test threads
          # x 2 jobs is more than the runner's 16 GB if two runaways overlap.
          cat > "$RUNNER_TEMP/cap-memory.sh" <<'CAP'
          #!/usr/bin/env bash
          set -euo pipefail
          ulimit -v 3145728
          exec "$@"
          CAP
          chmod +x "$RUNNER_TEMP/cap-memory.sh"
          export CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER="$RUNNER_TEMP/cap-memory.sh"
          df -h / | tee "$RUNNER_TEMP/resources.log"
          (while sleep 120; do
            { date -u +%T; df -h / | tail -1; free -m | sed -n 2p; } \
              | tee -a "$RUNNER_TEMP/resources.log"
          done) &
          monitor=$!
          trap 'kill "$monitor"' EXIT
          code=0
          cargo mutants --package tessel-coordinator --package tessel-lander \
            --test-tool nextest --jobs 2 --shard "$SHARD" "${filter_args[@]}" || code=$?
          case "$code" in
            0 | 2 | 3) ;;
            *) echo "::error::cargo mutants exited $code (1 usage error, 4 baseline failed)."
               exit "$code" ;;
          esac
          if [ -s mutants.out/timeout.txt ]; then
            echo "::warning::Timeouts in this shard. See mutants.out/timeout.txt."
            cat mutants.out/timeout.txt
          fi
          cp mutants.out/missed.txt "$RUNNER_TEMP/missed.txt"
          df -h / | tee -a "$RUNNER_TEMP/resources.log"
      - name: Upload mutants.out
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: mutants-out-${{ strategy.job-index }}
          path: |
            mutants.out
            ${{ runner.temp }}/resources.log
          retention-days: 7
          if-no-files-found: ignore
      - name: Upload missed mutants
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: missed-${{ strategy.job-index }}
          path: ${{ runner.temp }}/missed.txt
          if-no-files-found: error

  mutants-baseline:
    name: Nightly, full mutants
    if: ${{ always() }}
    needs: mutants
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Every shard finished
        env:
          RESULT: ${{ needs.mutants.result }}
        run: |
          if [ "$RESULT" != "success" ]; then
            echo "::error::Mutation shards finished as '$RESULT'."
            exit 1
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: missed-*
          path: ${{ runner.temp }}/missed
      - name: Compare with the baseline
        env:
          MISSED_DIR: ${{ runner.temp }}/missed
        run: |
          cat "$MISSED_DIR"/*/missed.txt > "$RUNNER_TEMP/all-missed.txt"
          echo "Missed mutants, all shards (line and column numbers are stripped for the baseline):"
          cat "$RUNNER_TEMP/all-missed.txt"
          scripts/ci/new-missed-mutants.sh .cargo/mutants-missed-baseline.txt \
            "$RUNNER_TEMP/all-missed.txt"

name: Mutants on named files

on:
  workflow_dispatch:
    inputs:
      files:
        description: Space-separated Rust files whose mutants are all tested
        required: true
        type: string
      regex:
        description: Optional regex; only mutants whose name matches are tested
        required: false
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  mutants-dispatch:
    name: Mutants on named files
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283  # v2.87.29
        with:
          tool: cargo-mutants@27.1.0,cargo-nextest@0.9.148
      - name: Mutants in the named files
        env:
          FILES: ${{ inputs.files }}
          REGEX: ${{ inputs.regex }}
        run: |
          set -f
          args=()
          for file in $FILES; do
            args+=(--file "$file")
          done
          if [ "${#args[@]}" -eq 0 ]; then
            echo "::error::No file named in the files input; refusing to mutate the whole package."
            exit 1
          fi
          if [ -n "$REGEX" ]; then
            args+=(--re "$REGEX")
          fi
          cargo mutants --package tessel-coordinator --test-tool nextest --jobs 2 "${args[@]}"
      - name: Show missed mutants
        if: failure()
        run: cat mutants.out/missed.txt

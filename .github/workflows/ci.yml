name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Fast lane, fmt and clippy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          shared-key: fast-lint
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy (native)
        run: cargo clippy --workspace --all-targets -- -D warnings

  workflow-lint:
    name: Fast lane, workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install actionlint
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$archive"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: actionlint
        run: actionlint
      - name: zizmor
        uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e  # v0.7.1
        with:
          version: 1.31.1
          inputs: .github/workflows/
          advanced-security: false
          annotations: true

  core-tests:
    name: Fast lane, core library tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          shared-key: fast-core-tests
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Core library tests
        run: cargo test -p tessel-coordinator --lib
      - name: Runtime rules table names real tests
        run: scripts/ci/check-named-tests.sh

  simulator:
    name: Fast lane, simulator
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          shared-key: fast-simulator
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # 1,000 seeds take about 45 s in release on a laptop (debug is 8 times slower), about two
      # minutes here with the build. The base is the commit's own number, so every commit sweeps
      # different seeds; a failing seed prints its rerun line.
      - name: Simulator, 1,000 seeds from the commit
        env:
          COMMIT_SHA: ${{ github.sha }}
          TESSEL_SIM_SEEDS: "1000"
        run: |
          TESSEL_SIM_FIRST_SEED=$((16#${COMMIT_SHA:0:8}))
          export TESSEL_SIM_FIRST_SEED
          echo "Seeds $TESSEL_SIM_FIRST_SEED to $((TESSEL_SIM_FIRST_SEED + TESSEL_SIM_SEEDS - 1))"
          cargo test -p tessel-coordinator --release --test simulator

  rust-workspace:
    name: Slow lane, Rust workspace
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          shared-key: workspace
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283  # v2.87.29
        with:
          tool: cargo-nextest@0.9.148
      - name: Workspace tests
        run: cargo nextest run --workspace

  landing:
    name: Slow lane, local landing end to end
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          shared-key: landing
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build the server and the CLI
        run: cargo build -p tessel-server -p tessel-cli
      - name: Land one commit by compare-and-swap after the runner's command ran
        run: tessel-server/ci/landing-e2e.sh

  quickstart:
    name: Slow lane, quickstart
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          shared-key: quickstart
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build the server, the CLI and the runner
        run: cargo build -p tessel-server -p tessel-cli -p tessel-runner
      - name: Run the commands of docs/local-setup.md and check the landed commit
        run: tessel-server/ci/quickstart.sh

  deny:
    name: Slow lane, advisories and bans
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283  # v2.87.29
        with:
          tool: cargo-deny@0.20.2
      - name: Advisories and bans
        run: cargo deny check advisories bans

  steward:
    name: Slow lane, steward
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tessel-steward
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
        with:
          version: 12.14.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22.23.3
          cache: pnpm
          cache-dependency-path: tessel-steward/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Test
        run: pnpm test

  mutants:
    name: Slow lane, mutants shard ${{ matrix.shard }}
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ["0/4", "1/4", "2/4", "3/4"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283  # v2.87.29
        with:
          tool: cargo-mutants@27.1.0,cargo-nextest@0.9.148
      - name: Diff against the base branch
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git diff "origin/$BASE_REF...HEAD" > "$RUNNER_TEMP/pr.diff"
      - name: Mutants on changed lines
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          if [ ! -s "$RUNNER_TEMP/pr.diff" ]; then
            echo "Empty diff: no mutants to test."
            exit 0
          fi
          code=0
          cargo mutants --in-diff "$RUNNER_TEMP/pr.diff" \
            --package tessel-coordinator --package tessel-lander \
            --test-tool nextest --jobs 2 --shard "$SHARD" || code=$?
          case "$code" in
            0) ;;
            3) if [ -s mutants.out/missed.txt ]; then
                 echo "::error::Timeouts and missed mutants (exit 3 hides the misses):"
                 cat mutants.out/missed.txt
                 exit 2
               fi
               echo "::warning::Timeouts only, no missed mutants (exit 3). See mutants.out/timeout.txt." ;;
            *) echo "::error::cargo mutants exited $code (2 missed, 4 baseline failed, 5 or 6 bad diff)."
               exit "$code" ;;
          esac
      - name: Show missed mutants
        if: failure()
        run: cat mutants.out/missed.txt

  mutants-gate:
    name: Slow lane, mutants on changed lines
    if: ${{ always() && github.event_name == 'pull_request' }}
    needs: mutants
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every shard passed
        env:
          RESULT: ${{ needs.mutants.result }}
        run: |
          if [ "$RESULT" != "success" ]; then
            echo "::error::Mutation shards finished as '$RESULT'."
            exit 1
          fi

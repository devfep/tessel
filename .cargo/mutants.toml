# cargo-mutants configuration, read by every `cargo mutants` run (nightly, per pull request with
# `--in-diff`, and the manual dispatch), because no run passes `--exclude-re` on the command line.
#
# The simulator (src/sim) is under mutation: its checkers, generator, clock, store, variants,
# driver and traffic. These patterns leave out only mutants the simulator tests missed on CI at
# two seeds and that nothing short of asserting a seed's random traffic could kill, or that need
# a state the host never produces. Each names its operator, so a new mutant in the same function
# is tested. No mutant the tests kill today is excluded.
# - driver.rs: `faults` (a harness mistake cannot be provoked from outside), `entrants` and
#   `awaiting_review` (they only steer which races and reviews the traffic picks), the
#   `wakes_set` counter in `set_wake` and `with_drift` (both feed a planted variant whose test
#   catches it by other means), and the lander port's `answer_call` (its `Reconcile` answer).
# - traffic.rs: the `+` in `arm_fault`'s crash length, the length of a clock step, the dice in
#   `claim`, `jump`, `watch` and `step`, and the clock-advance arm of `act`. They change which
#   traffic a seed runs, not whether a kind of request or fault occurs: tests/simulator.rs pins
#   every kind of request and both kinds of crash.
# - mod.rs: `cut_off_replays`' `&&` and `==`, and `failure_report`'s count line, which only
#   describe a run.
# The patterns match the names `cargo mutants --list` prints: re-check with it after any edit.
exclude_re = [
    'src/sim/driver\.rs:.*replace Sim::awaiting_review -> .* with Box::leak\(Box::new\(BTreeSet::from_iter\(\[[01]\]\)\)\)$',
    'src/sim/driver\.rs:.*replace Sim::entrants -> &\[u64\] with Vec::leak\((Vec::new\(\)|vec!\[[01]\])\)$',
    'src/sim/driver\.rs:.*replace Sim::faults -> &\[String\] with Vec::leak\(Vec::new\(\)\)$',
    'src/sim/driver\.rs:.*replace \+= with \*= in Sim::set_wake$',
    'src/sim/driver\.rs:.*replace with_drift -> String with ("xyzzy"\.into\(\)|String::new\(\))$',
    'src/sim/driver\.rs:.*replace == with != in Sim::answer_call$',
    'src/sim/driver\.rs:.*replace \|\| with && in Sim::answer_call$',
    'src/sim/traffic\.rs:.*replace \+ with \* in Traffic::arm_fault$',
    'src/sim/traffic\.rs:.*delete match arm 87\.\.= 91 in Traffic::act$',
    'src/sim/traffic\.rs:.*replace \+ with [-*] in Traffic::act$',
    'src/sim/traffic\.rs:.*replace \+ with \* in Traffic::(jump|watch)$',
    'src/sim/traffic\.rs:.*replace && with \|\| in Traffic::(claim|jump)$',
    'src/sim/traffic\.rs:.*replace &= with \|= in Traffic::step$',
    'src/sim/mod\.rs:.*replace (&& with \|\||== with !=) in cut_off_replays$',
    'src/sim/mod\.rs:.*replace > with >= in failure_report$',
]

[workspace]
members = [".", "tessel-cli", "tessel-lander", "tessel-runner", "tessel-server", "tessel-swarm"]
resolver = "2"

[package]
name = "tessel-coordinator"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
proptest = "1.11.0"

[profile.release]
opt-level = "s"
lto = true

[lints.clippy]
wildcard_enum_match_arm = "deny"
match_wildcard_for_single_variants = "deny"

[package]
name = "tessel-coordinator"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
worker = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
console_error_panic_hook = "0.1"
hmac = "=0.13.0"
sha2 = "=0.11.0"
base64 = "=0.23.1"

[dev-dependencies]
proptest = "1.11.0"

[profile.release]
opt-level = "s"
lto = true
